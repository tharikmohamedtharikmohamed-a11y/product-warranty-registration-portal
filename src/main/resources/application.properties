# Application Configuration

# Server Port
server.port=8080

# Spring Application Name
spring.application.name=warranty-portal

# Database Configuration
# Defaults to persistent local H2 file database (./data/warranty_portal_db.mv.db) for local development.
# Automatically overridden if SUPABASE_DB_URL, SUPABASE_DB_USERNAME, and SUPABASE_DB_PASSWORD environment variables are provided.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:file:./data/warranty_portal_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Configuration
# Environment variables used: JWT_SECRET, JWT_EXPIRATION
app.jwt.secret=${JWT_SECRET:KeVuIKH5HQi2Zz416bAXNl+OCi41Qfqqc4Vco8ZxmtS6FGPf81P3CyChc1bROowBybpkOep2ZO/3dTKjYPemsw==}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Controlled Admin Seed Configuration for Local Dev / Testing
app.admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
app.admin.seed.name=${ADMIN_SEED_NAME:System Admin}
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@warrantyportal.com}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:AdminPassword123}
app.admin.seed.phone=${ADMIN_SEED_PHONE:9999999999}

# Spring Boot Multipart File Upload Configuration (10MB Max Size)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase Storage Configuration
app.supabase.url=${SUPABASE_URL:https://cyzgjkjjhwqssobvovfj.supabase.co}
app.supabase.key=${SUPABASE_SERVICE_KEY:sb_publishable_fvARdV2oKBJej4dMmkdLEA_bFfhx4Ds}
app.supabase.bucket=${SUPABASE_STORAGE_BUCKET:product-invoices}

# CORS Allowed Origins Configuration for Frontend Integration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://127.0.0.1:3000,http://127.0.0.1:5173}



