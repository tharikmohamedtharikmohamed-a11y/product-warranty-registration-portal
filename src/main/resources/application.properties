# Application Configuration

# Server Port
server.port=8080

# Spring Application Name
spring.application.name=warranty-portal

# Supabase PostgreSQL Database Configuration
# Environment variables used: SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD
# Default fallbacks provided for local connection testing if environment variables are not set
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/warranty_db}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration for Supabase PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Security Configuration
# Environment variables used: JWT_SECRET, JWT_EXPIRATION
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Controlled Admin Seed Configuration for Local Dev / Testing
app.admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
app.admin.seed.name=${ADMIN_SEED_NAME:System Admin}
app.admin.seed.email=${ADMIN_SEED_EMAIL:admin@warrantyportal.com}
app.admin.seed.password=${ADMIN_SEED_PASSWORD:AdminPassword123}
app.admin.seed.phone=${ADMIN_SEED_PHONE:9999999999}

