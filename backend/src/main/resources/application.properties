# =============================================================================
# WarrantyHub — Spring Boot Backend Application Configuration
# Phase 3: Backend Initial Setup
# =============================================================================

# Server Port
server.port=8080

# Application Identity
spring.application.name=WarrantyHub

# -----------------------------------------------------------------------------
# Database Connection (Supabase PostgreSQL)
# Configured via environment variables; fallback placeholders provide structure
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.bfogwrprtsfvsgmbzvdp.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=WarrantyHubHikariPool

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# Existing schema from Phase 2 is validated without modification or drops
# -----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consistent UTC Timezone across database timestamps and Hibernate sessions
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------------
# Actuator Management Endpoints
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# JWT Security Configuration
# Sourced from JWT_SECRET environment variable
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=86400000

# -----------------------------------------------------------------------------
# Multipart Upload Configuration
# Supports up to 10 MB invoice files
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# -----------------------------------------------------------------------------
# Supabase Storage Configuration
# Backend-only access to private invoices storage bucket
# -----------------------------------------------------------------------------
supabase.url=${SUPABASE_URL:https://bfogwrprtsfvsgmbzvdp.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:invoices}

