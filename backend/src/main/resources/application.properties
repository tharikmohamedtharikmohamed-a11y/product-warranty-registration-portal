# =============================================================================
# WarrantyHub — Spring Boot Backend Application Configuration
# Phase 3: Backend Initial Setup
# =============================================================================

# Server Port
server.port=8080

# Application Identity
spring.application.name=WarrantyHub

# -----------------------------------------------------------------------------
# Database Connection (Supabase PostgreSQL)
# Configured via environment variables; fallback placeholders provide structure
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.bfogwrprtsfvsgmbzvdp.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=WarrantyHubHikariPool

# -----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# Existing schema from Phase 2 is validated without modification or drops
# -----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consistent UTC Timezone across database timestamps and Hibernate sessions
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# -----------------------------------------------------------------------------
# Actuator Management Endpoints
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
